input {
  # Recevoir les logs du backend Spring Boot
  tcp {
    port => 5044
    codec => json
    type => "backend"
  }

  # Flux de logs depuis stdin (pour les tests)
  stdin {
    type => "manual"
  }
}

filter {
  if [type] == "backend" {
    # Parser les logs JSON du backend
    if [message] {
      json {
        source => "message"
        skip_on_invalid_json => true
      }
    }

    # Extraire le niveau de log
    if [level] {
      mutate {
        add_field => { "log_level" => "%{level}" }
      }
    }

    # Ajouter les champs enrichis
    mutate {
      add_field => {
        "app" => "microcrm"
        "environment" => "local"
        "pipeline_version" => "1.0"
      }
    }

    # Ajouter un timestamp si absent
    if ![timestamp] {
      mutate {
        add_field => { "timestamp" => "%{@timestamp}" }
      }
    }

    # Parser les logs AUDIT
    if [message] =~ /AUDIT/ {
      mutate {
        add_field => { "event_type" => "audit" }
      }
      grok {
        match => { "message" => "AUDIT %{WORD:audit_action}: entity_type=%{WORD:entity_type}, entity_id=%{NUMBER:entity_id}, details=%{GREEDYDATA:audit_details}" }
      }
    }
  }
}

output {
  # Envoyer vers Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microcrm-logs-%{type}-%{+YYYY.MM.dd}"
  }

  # Afficher dans les logs (debug)
  stdout {
    codec => rubydebug
  }
}
