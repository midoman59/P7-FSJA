version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: front
    container_name: microcrm-front
    ports:
      - "80:80"
      - "443:443"
    networks:
      - microcrm
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: back
    container_name: microcrm-back
    ports:
      - "8080:8080"
    networks:
      - microcrm
    environment:
      - JAVA_OPTS=-Xmx512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  microcrm:
    driver: bridge
