name: CI - Build, Test & Analyze

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Build backend with Gradle
        run: |
          cd back
          ./gradlew build -x test

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: back/build/libs/

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Run backend tests with coverage
        run: |
          cd back
          ./gradlew test jacocoTestReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: back/build/test-results/

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/build/reports/jacoco/test/

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd front
          npm ci

      - name: Build frontend
        run: |
          cd front
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front/dist/

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd front
          npm ci

      - name: Run frontend tests with coverage
        run: |
          cd front
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload Istanbul coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-coverage
          path: front/coverage/

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build-backend, test-backend, build-frontend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Download JaCoCo coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: back/build/reports/jacoco/test/

      - name: Download Istanbul coverage report
        uses: actions/download-artifact@v4
        with:
          name: istanbul-coverage
          path: front/coverage/

      - name: Build backend for SonarQube
        run: |
          cd back
          ./gradlew build -x test

      - name: Build frontend for SonarQube
        run: |
          cd front
          npm ci
          npm run build

      - name: Run SonarQube analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  measure-dora-metrics:
    name: Measure DORA Metrics
    runs-on: ubuntu-latest
    needs: [build-backend, test-backend, build-frontend, test-frontend, sonarqube-analysis]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate DORA Metrics
        run: |
          # Lead Time for Changes: workflow start to completion
          WORKFLOW_START=${{ github.event.head_commit.timestamp }}
          WORKFLOW_END=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Calculate lead time in seconds
          START_EPOCH=$(date -d "$WORKFLOW_START" +%s)
          END_EPOCH=$(date -d "$WORKFLOW_END" +%s)
          LEAD_TIME=$((END_EPOCH - START_EPOCH))

          # Get workflow status for Change Failure Rate
          BUILD_STATUS="${{ needs.build-backend.result }}"
          TEST_STATUS="${{ needs.test-backend.result }}"
          FRONTEND_STATUS="${{ needs.build-frontend.result }}"
          FRONTEND_TEST_STATUS="${{ needs.test-frontend.result }}"
          SONAR_STATUS="${{ needs.sonarqube-analysis.result }}"

          # Calculate CFR (0 if all passed, 1 if any failed)
          CFR="0"
          if [[ "$BUILD_STATUS" == "failure" || "$TEST_STATUS" == "failure" || \
                "$FRONTEND_STATUS" == "failure" || "$FRONTEND_TEST_STATUS" == "failure" || \
                "$SONAR_STATUS" == "failure" ]]; then
            CFR="1"
          fi

          # Log metrics
          echo "=== DORA Metrics ==="
          echo "Lead Time for Changes: ${LEAD_TIME}s"
          echo "Change Failure Rate: ${CFR}"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Store DORA Metrics
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics
          path: |
            - Lead Time: ${{ github.event.head_commit.timestamp }}
            - Completion: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
            - Workflow ID: ${{ github.run_id }}

  status-check:
    name: Final Status Check
    runs-on: ubuntu-latest
    needs: [build-backend, test-backend, build-frontend, test-frontend, sonarqube-analysis, measure-dora-metrics]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build-backend.result }}" == "failure" || \
                "${{ needs.test-backend.result }}" == "failure" || \
                "${{ needs.build-frontend.result }}" == "failure" || \
                "${{ needs.test-frontend.result }}" == "failure" || \
                "${{ needs.sonarqube-analysis.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline FAILED"
            exit 1
          fi
          echo "✅ CI Pipeline PASSED"
