# SonarQube Configuration for MicroCRM
sonar.projectKey=midoman59_P7-FSJA
sonar.projectName=P7-FSJA
sonar.projectVersion=0.0.1-SNAPSHOT

# Sonar Cloud
sonar.host.url=https://sonarcloud.io
sonar.organization=midoman59

# Source code encoding
sonar.sourceEncoding=UTF-8

# Backend (Java/Spring Boot)
sonar.sources=back/src/main,front/src/app
sonar.tests=back/src/test
sonar.java.binaries=back/build/classes

# JaCoCo Coverage (Java/Backend)
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml

# Frontend (TypeScript/Angular)
sonar.typescript.lcov.reportPaths=front/coverage/microcrm/lcov.info

# Coverage settings
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/karma.conf.js

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts

# Quality Gate
# Not blocking CI: New Code Coverage is skewed by the 10-day rolling window
# on an actively developed project, and the free plan does not allow a
# custom Quality Gate to adjust that condition. Overall Code coverage
# remains the tracked quality metric (see SonarCloud dashboard).
sonar.qualitygate.wait=false

# Rules
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# OWASP Top 10 profile
sonar.profile=Sonar\ way\ Security

# Issue tracking
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts
